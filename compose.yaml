# 로컬 개발용 MySQL + Redis
# 실행: docker compose up -d / 종료: docker compose down (데이터 삭제까지: down -v)
services:
  mysql:
    image: mysql:8.4
    container_name: jkymhs-mysql
    environment:
      MYSQL_DATABASE: jkymhs
      MYSQL_USER: jkymhs
      MYSQL_PASSWORD: jkymhs
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4
    container_name: jkymhs-redis
    ports:
      - "6379:6379"

volumes:
  mysql-data:
