spring:
  application:
    name: backend

  autoconfigure:
    # 스프링 시큐리티가 기본으로 만드는 임시 계정(user / 랜덤 비밀번호)을 쓰지 않는다. 인증은 JWT로만 한다
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  # ${ENV_NAME:기본값} — 환경변수가 없으면 기본값(로컬 docker compose 값) 사용
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jkymhs}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:jkymhs}
    password: ${DB_PASSWORD:jkymhs}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:true}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis가 응답하지 않을 때 기본값(최대 60초)까지 기다리지 않고 바로 503을 주기 위해 짧게 설정
      timeout: 2s
      connect-timeout: 2s

jwt:
  # HS256 서명 키. 32바이트(영문 32자) 이상이어야 한다. 기본값을 두지 않아서 없으면 서버가 뜨지 않는다
  secret: ${JWT_SECRET}
  access-token-expiration: 30m
  refresh-token-expiration: 14d

google:
  # Google Cloud Console > OAuth 클라이언트 ID(웹 애플리케이션)의 값. 비밀값이라 환경변수로만 넣는다
  # 기본값을 비워둬서 구글 설정 없이도 서버는 뜬다 (구글 로그인만 실패한다)
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  # 인가 코드 → 액세스 토큰 교환, 액세스 토큰 → 사용자 정보(sub, email) 조회
  token-uri: https://oauth2.googleapis.com/token
  user-info-uri: https://openidconnect.googleapis.com/v1/userinfo

---
# 프로젝트 루트의 .env 파일(KEY=VALUE 형식)을 설정으로 읽는다. 파일이 없으면 무시한다 (optional)
# 비밀값(JWT_SECRET 등)은 .env나 서버 환경변수로만 넣고, 이 파일에는 쓰지 않는다
# test 프로필에서는 읽지 않는다. 개발자마다 다른 .env(실제 SMTP 계정 등)가 테스트 결과를 바꾸면 안 되기 때문이다
spring:
  config:
    activate:
      on-profile: "!test"
    import: optional:file:.env[.properties]
