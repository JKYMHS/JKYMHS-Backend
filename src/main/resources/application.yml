spring:
  application:
    name: backend

  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jkymhs}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:jkymhs}
    password: ${DB_PASSWORD:jkymhs}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:true}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${MAIL_SMTP_STARTTLS:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

  task:
    scheduling:
      pool:
        size: 4

mail:
  from: ${MAIL_FROM:no-reply@example.com}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 30m
  refresh-token-expiration: 14d

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  token-uri: https://oauth2.googleapis.com/token
  user-info-uri: https://openidconnect.googleapis.com/v1/userinfo

auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

tour-api:
  base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
  service-key: ${TOUR_API_KEY:}
  daily-call-limit: ${TOUR_API_DAILY_CALL_LIMIT:1000}
  timeout: 10s
  retry-backoff: 1s
  sync:
    cron: "0 0 4 * * *"
    intro-per-run: ${TOUR_SYNC_INTRO_PER_RUN:300}
  import:
    csv-dir: ${TOUR_IMPORT_CSV_DIR:}

batch:
  # false면 모든 @Scheduled 배치가 꺼짐
  enabled: ${BATCH_ENABLED:true}
  alert-webhook-url: ${BATCH_ALERT_WEBHOOK_URL:}

kakao-local:
  base-url: https://dapi.kakao.com
  rest-api-key: ${KAKAO_REST_API_KEY:}
  timeout: 3s

explore:
  closing-soon-minutes: 60
  page-size-max: 50

content-detail:
  refresh-after: 7d
  lock-ttl: 10s

popularity:
  cron: "0 0 * * * *"
  window: 30d

behavior:
  half-life: 30d
  profile-window: 180d
  companion-min-signals: 10
  executor:
    core-size: 2
    max-size: 4
    queue-capacity: 500

kakao-mobility:
  base-url: ${KAKAO_MOBILITY_BASE_URL:https://apis-navi.kakaomobility.com}
  rest-api-key: ${KAKAO_REST_API_KEY:}
  timeout: 3s

odsay:
  base-url: ${ODSAY_BASE_URL:https://api.odsay.com/v1/api}
  api-key: ${ODSAY_API_KEY:}
  timeout: 3s

route:
  cache-ttl: 7d
  walk-threshold-meters: 1000
  slow-walk-threshold-meters: 500
  transit-ratio: 1.5
  executor:
    core-size: 4
    max-size: 8
    queue-capacity: 200

trip:
  max-days: 14
  max-plans: 10
  max-items: 30

visit-check:
  mail-cron: "0 0 10 * * *"
  dismiss-days: 3
  mail-lookback-days: 7

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

recommendation:
  daily-limit: 10
  result-ttl: 24h
  candidate-cache-ttl: 1h
  candidate-pool-size: 200
  candidate-limit: 40
  deadline: 25s
  dedupe-window: 10s
  pending-timeout: 10m
  origin-retention: 24h
  cleanup-cron: "0 30 * * * *"
  executor:
    core-size: 4
    max-size: 8
    queue-capacity: 50

ai:
  provider: ${AI_PROVIDER:mock}
  base-url: ${AI_BASE_URL:}
  api-key: ${AI_API_KEY:}
  timeout: 20s

google-calendar:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  token-uri: https://oauth2.googleapis.com/token
  revoke-uri: https://oauth2.googleapis.com/revoke
  user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
  api-base-url: https://www.googleapis.com/calendar/v3
  token-encryption-key: ${CALENDAR_TOKEN_ENCRYPTION_KEY:}
  poll-interval: 2s
  batch-size: 50
  max-attempts: 3
  backoff-base: 5s
  lease: 5m
  timeout: 5s
  executor:
    core-size: 2
    max-size: 4
    queue-capacity: 100

---
spring:
  config:
    activate:
      on-profile: "!test"
    import: optional:file:.env[.properties]
