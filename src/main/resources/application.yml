spring:
  application:
    name: backend

  autoconfigure:
    # 스프링 시큐리티가 기본으로 만드는 임시 계정(user / 랜덤 비밀번호)을 쓰지 않는다. 인증은 JWT로만 한다
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  # ${ENV_NAME:기본값} — 환경변수가 없으면 기본값(로컬 docker compose 값) 사용
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jkymhs}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:jkymhs}
    password: ${DB_PASSWORD:jkymhs}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:true}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis가 응답하지 않을 때 기본값(최대 60초)까지 기다리지 않고 바로 503을 주기 위해 짧게 설정
      timeout: 2s
      connect-timeout: 2s

  # 인증 메일 SMTP. 기본값은 로컬 docker compose의 Mailpit (인증·암호화 없음)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    # JavaMail에 그대로 넘기는 설정. 이름에 점(.)이 들어 있어서 [ ]로 감싸 키 하나로 쓴다 (스프링 부트 문서 방식)
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${MAIL_SMTP_STARTTLS:false}
      # 기본값은 제한 없음(무한 대기)이라, SMTP 서버가 멈추면 요청도 같이 멈춘다. 5초(ms) 안에 안 되면 실패(502)로 처리한다
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

mail:
  # 인증 메일의 보낸 사람 주소. 실제 SMTP(Gmail 등)를 쓸 때는 그 계정 주소로 바꿔야 스팸으로 분류되지 않는다
  from: ${MAIL_FROM:no-reply@example.com}

jwt:
  # HS256 서명 키. 32바이트(영문 32자) 이상이어야 한다. 기본값을 두지 않아서 없으면 서버가 뜨지 않는다
  secret: ${JWT_SECRET}
  access-token-expiration: 30m
  refresh-token-expiration: 14d

google:
  # Google Cloud Console > OAuth 클라이언트 ID(웹 애플리케이션)의 값. 비밀값이라 환경변수로만 넣는다
  # 기본값을 비워둬서 구글 설정 없이도 서버는 뜬다 (구글 로그인만 실패한다)
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  # 인가 코드 → 액세스 토큰 교환, 액세스 토큰 → 사용자 정보(sub, email) 조회
  token-uri: https://oauth2.googleapis.com/token
  user-info-uri: https://openidconnect.googleapis.com/v1/userinfo

auth:
  # 리프레시 토큰 쿠키 속성. 배포 도메인 구성에 따라 달라져서 환경변수로 뺐다
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

cors:
  # 브라우저에서 이 API를 호출할 수 있는 FE 주소 (쉼표로 구분, 스킴과 호스트만. 경로·끝의 /·* 불가). 기본값이 비어 있어서 설정하기 전에는 어떤 Origin도 허용하지 않는다
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}


# 한국관광공사 TourAPI(KorService2) 연동 설정
tour-api:
  base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
  # 공공데이터포털 일반 인증키(Decoding). 비밀값이라 환경변수로만 넣는다. 비어 있으면 동기화 배치가 경고만 남기고 건너뛴다
  service-key: ${TOUR_API_KEY:}
  # 개발 계정 키는 하루 1000회까지만 호출할 수 있다. 이 횟수에 닿으면 배치를 멈추고 다음 실행에서 이어간다
  daily-call-limit: ${TOUR_API_DAILY_CALL_LIMIT:1000}
  # TourAPI가 응답하지 않을 때 배치 스레드가 하염없이 기다리지 않게 한다
  timeout: 10s
  # 5xx·네트워크 오류일 때 n번째 재시도 전에 n × 이 값만큼 기다린다 (1초, 2초)
  retry-backoff: 1s
  sync:
    # 매일 04:00(KST)에 그날까지 바뀐 콘텐츠만 받아온다. 사용자가 적은 새벽 시간이다
    cron: "0 0 4 * * *"
    # 한 번 실행할 때 운영 시간·쉬는 날(detailIntro2)을 새로 받을 콘텐츠 수. 일일 호출 한도 안에서 나눠 받는다
    intro-per-run: ${TOUR_SYNC_INTRO_PER_RUN:300}
  import:
    # tools/tourapi/collect.py가 만든 CSV 폴더. 값이 있으면 서버 시작 시 CSV를 DB에 적재한다 (비어 있으면 건너뛴다)
    csv-dir: ${TOUR_IMPORT_CSV_DIR:}

batch:
  # false면 @Scheduled 배치를 모두 끈다 (서버를 여러 대 띄울 때 한 대만 배치를 돌리는 용도)
  enabled: ${BATCH_ENABLED:true}
  # 배치가 실패하면 {"text": "..."}를 이 주소로 POST한다 (슬랙·디스코드 웹훅 등). 비어 있으면 ERROR 로그만 남긴다
  alert-webhook-url: ${BATCH_ALERT_WEBHOOK_URL:}

# 카카오 로컬 API (출발지 검색·현재 위치 → 주소)
kakao-local:
  base-url: https://dapi.kakao.com
  # 카카오 개발자 앱의 REST API 키. 비밀값이라 환경변수로만 넣는다. 비어 있으면 출발지 검색만 502로 실패한다
  rest-api-key: ${KAKAO_REST_API_KEY:}
  # 사용자가 화면에서 기다리는 요청이라 짧게 둔다
  timeout: 3s

# 탐색 화면 규칙
explore:
  # 닫기 몇 분 전부터 "곧 마감(soon)"으로 보여줄지
  closing-soon-minutes: 60
  # 목록 한 페이지 최대 개수 (size 파라미터 상한)
  page-size-max: 50

# 상세 화면 캐시
content-detail:
  # 소개글·사진을 받은 지 이만큼 지나면 다음 조회 때 TourAPI에서 다시 받는다 (하루 호출 한도를 아끼려고 길게 둔다)
  refresh-after: 7d
  # 같은 콘텐츠를 여러 요청이 동시에 다시 받지 않게 거는 락의 유효 시간 (갱신이 멈춰도 이 시간 뒤엔 풀린다)
  lock-ttl: 10s

# 인기 점수 배치
popularity:
  # 매시 정각(KST)에 최근 조회·찜·일정 담기 수로 인기 점수(0~1000)를 다시 계산한다
  cron: "0 0 * * * *"
  # 인기 점수에 넣을 최근 기간
  window: 30d

# 행동 데이터·취향 프로필
behavior:
  # 오래된 행동일수록 덜 반영한다. 이 기간이 지나면 가중치가 절반이 된다
  half-life: 30d
  # 프로필을 계산할 때 이 기간보다 오래된 행동은 버린다
  profile-window: 180d
  # 동행별 프로필은 신호가 이 개수 이상일 때만 쓰고, 그 전에는 공통 프로필을 쓴다
  companion-min-signals: 10
  # 행동 이벤트를 요청 스레드 밖에서 저장하는 전용 스레드 풀
  executor:
    core-size: 2
    max-size: 4
    queue-capacity: 500

---
# 프로젝트 루트의 .env 파일(KEY=VALUE 형식)을 설정으로 읽는다. 파일이 없으면 무시한다 (optional)
# 비밀값(JWT_SECRET 등)은 .env나 서버 환경변수로만 넣고, 이 파일에는 쓰지 않는다
# test 프로필에서는 읽지 않는다. 개발자마다 다른 .env(실제 SMTP 계정 등)가 테스트 결과를 바꾸면 안 되기 때문이다
spring:
  config:
    activate:
      on-profile: "!test"
    import: optional:file:.env[.properties]
