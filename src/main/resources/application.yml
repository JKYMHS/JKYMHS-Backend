spring:
  application:
    name: backend

  config:
    # 프로젝트 루트의 .env 파일(KEY=VALUE 형식)을 설정으로 읽는다. 파일이 없으면 무시한다 (optional)
    # 비밀값(JWT_SECRET 등)은 .env나 서버 환경변수로만 넣고, 이 파일에는 쓰지 않는다
    import: optional:file:.env[.properties]

  autoconfigure:
    # 스프링 시큐리티가 기본으로 만드는 임시 계정(user / 랜덤 비밀번호)을 쓰지 않는다. 인증은 JWT로만 한다
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  # ${ENV_NAME:기본값} — 환경변수가 없으면 기본값(로컬 docker compose 값) 사용
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jkymhs}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:jkymhs}
    password: ${DB_PASSWORD:jkymhs}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:true}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis가 응답하지 않을 때 기본값(최대 60초)까지 기다리지 않고 바로 503을 주기 위해 짧게 설정
      timeout: 2s
      connect-timeout: 2s

jwt:
  # HS256 서명 키. 32바이트(영문 32자) 이상이어야 한다. 기본값을 두지 않아서 없으면 서버가 뜨지 않는다
  secret: ${JWT_SECRET}
  access-token-expiration: 30m
  refresh-token-expiration: 14d
